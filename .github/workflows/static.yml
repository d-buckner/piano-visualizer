# Build, test and deploy the demo to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test:run
      - name: Build
        run: pnpm run build
      - name: Verify tree shaking
        run: pnpm run check:shaking
      # bundlers resolve extensionless imports, so a package that only works
      # inside a bundler passes every other check here and breaks on install
      - name: Verify package resolves as ESM
        run: pnpm run check:package
      - name: Build demo
        run: pnpm run build:demo
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium
      # the renderer is WebGL2 and happy-dom has no GL context, so the acceptance
      # suite is the only place the actual drawing path is exercised
      - name: Acceptance tests
        run: pnpm run test:acceptance
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: './demo-dist'

  deploy:
    needs: build-and-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: demo
          path: './demo-dist'
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './demo-dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
